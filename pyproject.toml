[project]
name = "arkanoid"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "pydantic>=2.14.3,<3",
    "uvicorn>=0.54.0,<0.55",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0,<3",
    "pillow>=13.0.0,<14",
    "pre-commit>=4.7.0,<5",
    "ruff>=0.17.4,<0.18",
]

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
